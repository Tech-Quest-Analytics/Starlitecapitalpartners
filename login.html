<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6fb;
      font-family: 'Inter', system-ui, sans-serif;
      color: #1a2138;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 10px 40px rgba(26, 33, 56, 0.08);
      border: 1px solid rgba(0,0,0,0.06);
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #6b7aaa;
      font-size: 14px;
      margin-bottom: 32px;
    }
    .field {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #4a5568;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #d1d9e6;
      border-radius: 10px;
      font-size: 15px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #4a7bff;
      box-shadow: 0 0 0 3px rgba(74, 123, 255, 0.15);
    }
    .password-wrap {
      position: relative;
    }
    .toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #9aa3be;
      cursor: pointer;
      font-size: 14px;
    }
    .toggle:hover { color: #4a7bff; }
    button[type="submit"] {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      background: #4a7bff;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    button[type="submit"]:hover {
      background: #3a6aef;
    }
    button[type="submit"]:active {
      transform: scale(0.98);
    }
    .forgot {
      text-align: right;
      margin-top: -8px;
      margin-bottom: 20px;
    }
    .forgot a {
      font-size: 13px;
      color: #6b7aaa;
      text-decoration: none;
    }
    .forgot a:hover { color: #4a7bff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign in</h1>
    <p class="subtitle">Enter your credentials to continue</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="toggle" onclick="togglePassword()">Show</button>
        </div>
      </div>

      <div class="forgot">
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit">Sign In</button>
    </form>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      const btn = document.querySelector('.toggle');
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = 'Hide';
      } else {
        input.type = 'password';
        btn.textContent = 'Show';
      }
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      alert(`Login attempt\nEmail: ${email}\nPassword: ${password}`);
      // Replace with real login logic later
    });
  </script>
</body>
</html>
